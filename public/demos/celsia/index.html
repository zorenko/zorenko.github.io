<!doctype html>
<html lang="en">
<head>
  <!-- The Celsia demo on the portfolio home page (content/work.ts): Celsia's sustainability reporting app, only the app's
       window, starting at Home. docs/demos.md says how demos like this are made. Celsia's work is under NDA, so the demo
       is rebranded away from the production app and simplified for anyone to follow: plain words instead of the
       standards' codes, and none of the production app's specialist set-up. Dark: soft greys with one pale lemon accent
       (styles.css), Geist, Lucide's line icons (icons.js) and skeuomorphic icons drawn for the sidebar
       and Home (skeu.js); its screenshots are of the demo itself. The screens began as Figma frames ("Celsia app –
       Concepts 24-25" and "portfolio - cv", 453:10707), some of them only concepts.
       The app's sidebar moves between Home, the report with its guide (its numbers and texts open in a sidebar),
       Insights, a target and the Help center. Only Climate is written;
       the report's other topics show but aren't in the demo. Everything is in memory: a reload starts over.
       A walkthrough (../walkthrough.js, its steps at the end of script.js): Anastasia's cursor goes through the pages by
       itself, gives way when the visitor presses or types in the demo, and carries on from their page when they stop. ?nowalk
       turns it off. -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Celsia demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- ?glass: the page is see-through around the white panel, so the card it sits on shows through (the site used it for a glass card; it now shows the demo in a browser window) -->
  <script>if (new URLSearchParams(location.search).has('glass')) document.documentElement.classList.add('is-glass')</script>
</head>
<body>
<!-- The skeuomorphic icons' gradients (skeu.js, styles.css .sk): top to bottom, warm stone lit from above on the dark, and in the accent's lemon in the current page -->
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <defs>
    <linearGradient id="sk-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#54514b"/><stop offset="1" stop-color="#393733"/></linearGradient>
    <linearGradient id="sk-line" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#99948a"/><stop offset="1" stop-color="#5c5851"/></linearGradient>
    <linearGradient id="sk-fill-back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43413c"/><stop offset="1" stop-color="#32302d"/></linearGradient>
    <linearGradient id="sk-line-back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#726e66"/><stop offset="1" stop-color="#4b4843"/></linearGradient>
    <linearGradient id="sk-fill-on" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#52513f"/><stop offset="1" stop-color="#3b3b30"/></linearGradient>
    <linearGradient id="sk-line-on" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f5c4"/><stop offset="1" stop-color="#bdbb7b"/></linearGradient>
  </defs>
</svg>
<div class="app" data-app>
  <nav class="rail" aria-label="Celsia" data-rail></nav>
  <main class="main">
    <div class="body" data-report>
      <nav class="toc" aria-label="Report" data-toc></nav>
      <div class="stage" data-stage></div>
      <aside class="dp" aria-label="Data point" data-dp hidden></aside>
    </div>
    <div class="page" data-page hidden></div>
  </main>
  <div class="layer" data-layer></div>
  <div class="toasts" data-toasts aria-live="polite"></div>
</div>
<script src="icons.js"></script>
<script src="skeu.js"></script>
<script src="../walkthrough.js"></script>
<script src="script.js"></script>
</body>
</html>
